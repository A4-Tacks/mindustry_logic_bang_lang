name: CI
on:
  pull_request:
  merge_group:

jobs:
  check-empty:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Check whitespace
        run: |
          ! git show | grep -P '^\+.*[ \t\r]+$'
      - name: Check eol on eof
        run: |
          ! git show | grep '^\\ No newline at end of file$'
      - name: Check snippet sync
        run: |
          diff -u syntax/vscode/support/snippets/snippets.json <(./syntax/vscode/make-snippets.jq ./syntax/vim/UltiSnips/mdtlbl.snippets)
