name: test

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - run: cargo build
      - run: PATH=$(realpath target/debug):$PATH ./examples/test.sh

      - name: Check snippet sync
        run: |
          diff -u syntax/vscode/support/snippets/snippets.json <(./syntax/vscode/make-snippets.jq ./syntax/vim/UltiSnips/mdtlbl.snippets)
